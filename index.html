<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flappy Bird</title>
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { background: #70c5ce; }
</style>
</head>
<body>
<canvas id="c" width="320" height="480"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const GAP = 120, PIPE_W = 50, GRAVITY = 0.5, FLAP = -7.5, SPEED = 2;
let bird, pipes, score, best = 0, frame, over;

function reset() {
  bird = { y: 240, v: 0 };
  pipes = [];
  score = 0; frame = 0; over = false;
}

function flap() {
  if (over) reset(); else bird.v = FLAP;
}
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
c.addEventListener('mousedown', flap);

function update() {
  if (over) return;
  frame++;
  bird.v += GRAVITY;
  bird.y += bird.v;

  if (frame % 90 === 1) pipes.push({ x: c.width, top: 60 + Math.random() * (c.height - GAP - 120), scored: false });
  pipes.forEach(p => p.x -= SPEED);
  pipes = pipes.filter(p => p.x + PIPE_W > 0);

  for (const p of pipes) {
    const hitX = 60 + 12 > p.x && 60 - 12 < p.x + PIPE_W;
    const hitY = bird.y - 12 < p.top || bird.y + 12 > p.top + GAP;
    if (hitX && hitY) over = true;
    if (!p.scored && p.x + PIPE_W < 60) { p.scored = true; score++; }
  }
  if (bird.y + 12 > c.height || bird.y - 12 < 0) over = true;
  if (over) best = Math.max(best, score);
}

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#2e9e3b';
  pipes.forEach(p => {
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + GAP, PIPE_W, c.height);
  });
  ctx.fillStyle = '#ffd400';
  ctx.beginPath(); ctx.arc(60, bird.y, 12, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(score, c.width / 2, 40);
  if (over) {
    ctx.fillText('Game Over', c.width / 2, 220);
    ctx.font = '14px sans-serif';
    ctx.fillText('Best: ' + best + ' - press Space / click to restart', c.width / 2, 250);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
reset();
loop();
</script>
</body>
</html>
